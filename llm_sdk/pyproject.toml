[project]
name = "llm-sdk"
version = "0.1.0"
description = "LLM SDK for local model inference"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
]

# Añade esto para indicarle a uv que baje la versión ligera de CPU
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Forzamos a que 'torch' se descargue únicamente desde el índice de CPU
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
